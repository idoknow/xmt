name: net-debug

on:
  workflow_dispatch:

jobs:
  probe:
    name: 探测 runner 到 Rancher 的连通性
    runs-on: ubuntu-24.04
    steps:
      - name: DNS
        run: |
          getent hosts rancher.rockchin.top || true
          python3 - <<'PY'
          import socket
          try:
              print("v4", socket.getaddrinfo("rancher.rockchin.top", 443, socket.AF_INET)[:2])
          except Exception as e:
              print("v4 err", e)
          try:
              print("v6", socket.getaddrinfo("rancher.rockchin.top", 443, socket.AF_INET6)[:2])
          except Exception as e:
              print("v6 err", e)
          PY

      - name: TCP / TLS
        run: |
          timeout 20 bash -c '</dev/tcp/rancher.rockchin.top/443' && echo "tcp ok" || echo "tcp FAIL"
          timeout 25 openssl s_client -connect rancher.rockchin.top:443 -servername rancher.rockchin.top </dev/null 2>&1 | head -40 || true

      - name: curl verbose
        run: |
          curl -sS -o /dev/null -sv -m 25 https://rancher.rockchin.top/k8s/clusters/local/version 2>&1 | sed -n '1,60p' || echo "curl exit $?"
          echo "---"
          curl -sS -o /dev/null -w 'http %{http_code} connect %{time_connect}s tls %{time_appconnect}s\n' -m 25 https://rancher.rockchin.top/k8s/clusters/local/version || echo "curl short FAIL"

      - name: curl to site
        run: curl -sS -o /dev/null -w 'site http %{http_code}\n' -m 25 https://xmt.idoknow.top/healthz.txt || echo "site FAIL"
