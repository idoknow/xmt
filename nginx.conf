worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  log_format brief '$remote_addr "$request" $status $body_bytes_sent "$http_referer"';
  access_log /var/log/nginx/access.log brief;

  # 构建阶段已生成 .gz，这里直接发；同时给未预压缩的响应也开 gzip
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 安全头：location 里一旦自己写 add_header 就不会继承这里的，故各段重复
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 探活与版本：不缓存，供集群 readiness 与外部探针使用
    location = /healthz.txt {
      access_log off;
      add_header Cache-Control "no-store" always;
    }

    location = /build.txt {
      add_header Cache-Control "no-store" always;
    }

    # 指纹资源：内容变则 URL 变，可以放心长缓存
    location /assets/ {
      try_files $uri =404;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 页面：干净路径（/orgs → orgs.html），每次都回源校验
    location / {
      try_files $uri $uri.html $uri/ =404;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options SAMEORIGIN always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Cache-Control "no-cache" always;
    }

    location = /404.html {
      internal;
    }

    error_page 404 /404.html;
  }
}
